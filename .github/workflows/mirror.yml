# Brings each new commit of the source repository here, every 15 minutes,
# and tags each release on the commit it was built from.
#
# The source repository is private, so the job reads it with a read-only
# deploy key: the secret SOURCE_DEPLOY_KEY, for the repository the secret
# SOURCE_REPOSITORY names. Its name is a secret too, so that the public log
# of a run shows it masked. The only step that writes here is
# tool/public_sync.py from that repository. It checks every commit before it
# pushes, and stops at one that must not be public. A push made with the
# workflow's token starts no other workflow, so this one runs the CI on what
# it pushed, and the tool starts the release workflow (release.yml) for each
# release tag it pushed. That token cannot push a change to a workflow, so
# the tool stops at one, and it goes here by hand.
#
# It does nothing until SOURCE_REPOSITORY is set. To stop it, set the
# repository variable MIRROR_PAUSED to true.
name: Mirror

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: bring new commits here
    if: github.repository == 'SynAdam/fortivavpn' && vars.MIRROR_PAUSED != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # A job's condition cannot read a secret, so each step waits for it.
    env:
      SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
    outputs:
      pushed: ${{ steps.sync.outputs.pushed }}
    steps:
      - name: check out the source repository's main
        if: env.SOURCE_REPOSITORY != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: refs/heads/main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      # The checkout fetches one ref alone, because a fetch prints each branch
      # it fetches, and the names of our branches stay ours. This fetches the
      # rest quietly: every branch, whose names the tool keeps out of the
      # public messages, every tag, and the whole history.
      - name: fetch the rest of the source repository quietly
        if: env.SOURCE_REPOSITORY != ''
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          key="$RUNNER_TEMP/source-key" hosts="$RUNNER_TEMP/github-hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes" \
            git fetch --quiet --unshallow --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - if: env.SOURCE_REPOSITORY != ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: publish its new commits and release tags
        id: sync
        if: env.SOURCE_REPOSITORY != ''
        env:
          PUBLIC_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/public_sync.py --mirror --push --in-actions

  ci:
    needs: mirror
    if: needs.mirror.outputs.pushed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: main
