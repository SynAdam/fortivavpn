# Brings each new commit of the source repository here, every 15 minutes,
# and tags each release on the commit it was built from.
#
# The source repository is private, so the job reads it with a read-only
# deploy key: the secret SOURCE_DEPLOY_KEY, for the repository the secret
# SOURCE_REPOSITORY names. Its name is a secret too, so that the public log
# of a run shows it masked. The only step that writes here is
# tool/public_sync.py from that repository. It checks every commit before it
# pushes, and stops at one that must not be public. A push made with the
# workflow's token starts no other workflow, so this one runs the CI on what
# it pushed.
#
# It does nothing until SOURCE_REPOSITORY is set. To stop it, set the
# repository variable MIRROR_PAUSED to true.
name: Mirror

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: bring new commits here
    if: github.repository == 'SynAdam/fortivavpn' && vars.MIRROR_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job's condition cannot read a secret, so each step waits for it.
    env:
      SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
    outputs:
      pushed: ${{ steps.sync.outputs.pushed }}
    steps:
      - name: check out the source repository
        if: env.SOURCE_REPOSITORY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - if: env.SOURCE_REPOSITORY != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: publish its new commits and release tags
        id: sync
        if: env.SOURCE_REPOSITORY != ''
        env:
          PUBLIC_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/public_sync.py --mirror --push --in-actions

  ci:
    needs: mirror
    if: needs.mirror.outputs.pushed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: main
