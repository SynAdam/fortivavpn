# Builds the two APKs of a release tag, signs them with the upload key,
# checks them, and publishes the tag's GitHub Release with them.
#
# The mirror workflow starts it for each release tag it brings here. It can
# also be started by hand for a tag that is here already, such as after a run
# that failed; with publish off it only builds and checks.
#
# The job runs in the environment "release". Only that environment holds the
# upload key, and a reviewer must approve each run before it starts. The
# source is the repository the mirror reads, at the tag, because the copy
# here leaves out the addresses the app is built with (lib/api/built_in.dart).
# Its build and checks are tool/release.sh --build there, and the release is
# made by tool/public_sync.py, which checks every file and the page before
# anything is public.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v2.4.0
        required: true
      publish:
        description: Publish the GitHub Release (off builds and checks only)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: build, check and publish
    if: github.repository == 'SynAdam/fortivavpn'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
    steps:
      - name: check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          [ -n "$SOURCE_REPOSITORY" ] || { echo "The secret SOURCE_REPOSITORY is not set."; exit 1; }

      - name: check out the source repository at the tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: put the upload key in place
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > android/app/fortiva_release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=fortiva_release.keystore\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/keystore.properties

      - name: build and check the two APKs
        run: ./tool/release.sh --build

      - name: remove the upload key
        if: always()
        run: rm -f android/app/fortiva_release.keystore android/keystore.properties

      - name: publish the GitHub Release
        if: inputs.publish
        env:
          PUBLIC_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/public_sync.py "$TAG" --push --in-actions --assets "build/release-${TAG#v}"
